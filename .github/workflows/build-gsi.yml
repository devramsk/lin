name: LineageOS 21 pre-QPR2 GSI
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe checks resources and upstream; build attempts the full build if resources permit'
        type: choice
        options: [probe, build]
        default: probe
      ubuntu_version:
        description: 'Ubuntu version for the build job'
        type: choice
        options: [ubuntu-22.04, ubuntu-24.04]
        default: ubuntu-22.04
      shallow:
        description: 'Experimental shallow repo sync (can break repopick)'
        type: boolean
        default: false
      partial:
        description: 'Experimental partial clone (incompatible with shallow)'
        type: boolean
        default: false
      reclaim_space:
        description: 'Remove selected preinstalled tools on disposable GitHub-hosted VM'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lineage-gsi-free-hosted
  cancel-in-progress: false
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check scripts and safeguards
        run: |
          bash -n scripts/*.sh
          bash tests/safety.sh
          bash tests/staged-safety.sh
          bash tests/disk-guard.sh
          bash tests/reclaim-safety.sh
          bash tests/build-dependencies.sh
      - name: Install and verify build dependencies
        if: ${{ inputs.mode == 'probe' }}
        run: bash scripts/install-build-deps.sh
      - name: Report resource limits
        run: |
          df -h "$RUNNER_TEMP"
          free -h
          printf '%s\n' 'LineageOS recommends roughly 400 GB of free storage; this workflow attempts a build without a minimum disk-space gate.' >> "$GITHUB_STEP_SUMMARY"
  upstream-inventory:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Inspect pinned upstream repositories and manifest
        env:
          AUDIT_OUTPUT: ${{ runner.temp }}/lineage-upstream-audit
        run: bash scripts/audit-upstream.sh
      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: upstream-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lineage-upstream-audit/inventory.txt
            ${{ runner.temp }}/lineage-upstream-audit/versions.txt
            ${{ runner.temp }}/lineage-upstream-audit/inventory.bundle
          if-no-files-found: warn
          retention-days: 3
  build:
    if: ${{ inputs.mode == 'build' }}
    needs: preflight
    runs-on: ${{ inputs.ubuntu_version || 'ubuntu-22.04' }}
    timeout-minutes: 360
    env:
      BUILD_ROOT: /home/runner/work/_temp/lineage-gsi
      MIN_FREE_GIB: 0
      REPO_DEPTH: ${{ inputs.shallow && '1' || '0' }}
      REPO_PARTIAL: ${{ inputs.partial && '1' || '0' }}
    steps:
      - name: Report resources before syncing
        id: resources
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted || exit 1
          test "$RUNNER_TEMP" = /home/runner/work/_temp || { echo "Unexpected runner temp path" >&2; exit 1; }
          df -h "$RUNNER_TEMP"; free -h
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Reclaim optional preinstalled tool space
        if: ${{ inputs.reclaim_space }}
        run: bash scripts/reclaim-hosted-space.sh
      - name: Initialize source workspace
        env:
          STAGE: setup
        run: bash scripts/staged-build-gsi.sh
      - name: Sync sources and repopick
        env:
          STAGE: sync
        run: bash scripts/staged-build-gsi.sh
      - name: Apply patches
        env:
          STAGE: patch
        run: bash scripts/staged-build-gsi.sh
      - name: Build 64VN system image
        env:
          STAGE: build-64VN
        run: bash scripts/staged-build-gsi.sh
      - name: Build 64GN system image
        env:
          STAGE: build-64GN
        run: bash scripts/staged-build-gsi.sh
      - name: Verify images and hashes
        env:
          STAGE: validate
        run: bash scripts/staged-build-gsi.sh
      - name: Summarize completed and failed stages
        if: ${{ always() && steps.resources.outcome == 'success' }}
        run: |
          echo '## Build stage events (metadata, not compiled artifacts)' >> "$GITHUB_STEP_SUMMARY"
          if [ -d "$BUILD_ROOT/audit/events" ]; then
            for f in "$BUILD_ROOT"/audit/events/*; do
              [ -f "$f" ] || continue
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              printf '```\n' >> "$GITHUB_STEP_SUMMARY"
            done
          fi
      - name: Bundle audit history
        if: ${{ always() && steps.resources.outcome == 'success' }}
        run: |
          if [ -d "$BUILD_ROOT/audit/.git" ]; then
            git -C "$BUILD_ROOT/audit" bundle create "$BUILD_ROOT/audit-history.bundle" --all || true
          fi
      - name: Upload audit logs
        if: ${{ always() && steps.resources.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lineage-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lineage-gsi/audit/logs/
            ${{ runner.temp }}/lineage-gsi/audit/events/
            ${{ runner.temp }}/lineage-gsi/audit/resources.log
            ${{ runner.temp }}/lineage-gsi/audit/resolved-manifest.xml
            ${{ runner.temp }}/lineage-gsi/audit/SHA256SUMS
            ${{ runner.temp }}/lineage-gsi/audit-history.bundle
          if-no-files-found: warn
          retention-days: 3
      - name: Upload images
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lineage-gsi-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lineage-gsi/home/build-output/*.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
